# 불러오기 · 게시 허용 범위
channels:
  - { id: UCxlc0Ky0aWoD8uI09ad44Tg, name: 외롭여 }
  - { id: UC-ee_ziASM251TMXe3P3VZA, name: 리즈시절 LizTV }
  - { id: UC09L3JxGVcn7SKLa-pjTEmw, name: 러브커넥트 유지연 }
