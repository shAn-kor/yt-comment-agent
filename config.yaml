# 본인 테스트 영상 ID (예: dQw4w9WgXcQ). 링크 직접 입력과 게시가 항상 허용된다.
test_videos: []

# test_only: 테스트 영상에만 게시 / channels: 위 채널 영상에도 게시
posting_scope: test_only

comment: { min_chars: 40, max_chars: 120, brand: 운명원 }
limits: { daily_max_comments: 10, videos_per_channel: 5 }

# 뜨기 직전 영상 찾기 (초안까지만)
rising: { query: 연애, scan: 30, min_views: 1000, max_views: 5000, min_views_per_hour: 150 }
